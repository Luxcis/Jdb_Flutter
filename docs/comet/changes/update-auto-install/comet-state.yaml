acceptance:
  - id: A1
    source: brief.md
    text: "A1: APK 下载完成且实际 SHA-256
      与期望哈希一致时，弹窗自动进入校验状态并调起系统安装器，全程无需用户点击「安装」；调起成功（`OpenFilex` 返回 done）后弹窗关闭。"
    result: pending
    reason: null
  - id: A2
    source: brief.md
    text: "A2: APK 下载完成的瞬间弹窗即展示「正在校验安装包完整性…」，安装编排（校验 +
      调起）自动执行且仅执行一次：不存在「下载完成，点击『安装』可开始更新」的首次等待态，也不产生重复调用。"
    result: pending
    reason: null
  - id: A3
    source: brief.md
    text: "A3:
      自动校验结果为不一致时弹窗行为与既有分支一致：不调起安装器、删除已下载文件、提示「安装包校验失败，已阻止安装」，并保留「重新下载」入口；重新下载完\
      成后再次自动进入校验流程。"
    result: pending
    reason: null
  - id: A4
    source: brief.md
    text: "A4: 自动校验结果为无法校验（期望哈希缺失/非法、文件不可读）时弹窗
      fail-closed：不调起安装器、保留已下载文件、提示「无法校验安装包完整性，已阻止安装」，并保留「安装」按钮供手动重试重验。"
    result: pending
    reason: null
  - id: A5
    source: brief.md
    text: "A5: 校验通过但系统安装器调起失败时弹窗保持既有降级：提示「安装包已下载，请在通知栏/文件管理器中安装」，并保留「安装」按钮供手动重试调起。"
    result: pending
    reason: null
  - id: A6
    source: brief.md
    text: "A6: 下载完成前弹窗行为不变：弹窗内容展示、下载进度（线性进度条 + 百分比）、下载失败的提示与重新下载入口均与现状一致。"
    result: pending
    reason: null
