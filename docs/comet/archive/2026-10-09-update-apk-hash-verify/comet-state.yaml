    reason:
      text: 弹窗 _startDownload 完成后停在 downloaded 完成态并显示「安装」按钮，测试断言未点击前 installCalls==0
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: 校验通过安装：点击「安装」时计算已下载 APK 的实际 SHA-256，与期望哈希一致（无论期望值来自资产 `digest` 还是
      `.sha256` 文件）时调起系统安装器，弹窗不出现失败提示。"
    result: passed
    reason:
      text: _verifyAndInstallApk 经 verifyApk 计算实际 SHA-256 比对，verified 才调
        OpenFilex，通过路径无失败提示（测试覆盖 digest 与 .sha256 两来源）
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: 校验不一致阻止安装：实际 SHA-256
      与期望哈希不一致时不调起系统安装器，删除已下载的损坏文件，弹窗显示「安装包校验失败，已阻止安装」并可重新下载。"
    result: passed
    reason:
      text: mismatch 分支先 deleteApk 再返回
        hashMismatch，不调安装器；弹窗提示「安装包校验失败，已阻止安装」且按钮变为「重新下载」
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: 回退 `.sha256` 文件校验：资产 `digest` 缺失且同名 `.sha256`
      文件可下载时，以该文件解析的期望哈希（取首列哈希、忽略 `sha256:` 前缀与十六进制大小写）完成校验，结果与使用 `digest` 时一致。"
    result: passed
    reason:
      text: "resolveExpectedSha256 在 digest 缺失/非法时下载同名 .sha256（经代理拼接），parseApkDigest
        取首列、忽略 sha256: 前缀与大小写；verifyApk 回退校验测试 verified"
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: 无法校验时不安装：资产 `digest` 缺失且 `.sha256`
      文件不可获取（下载失败或内容非法）时，不调起系统安装器并提示「无法校验安装包完整性」（fail-closed，不静默放行安装）。"
    result: passed
    reason:
      text: .sha256 请求失败或解析非法时
        expected=null→unavailable→hashUnavailable，不调安装器、文件保留可重试，fail-closed
      truncated: false
  - id: A6
    source: brief.md
    text: "A6: 校验过程可见：点击「安装」后的校验期间弹窗显示「正在校验安装包完整性…」，同一时刻不重复触发校验；校验结束后仅有通过或失败两种可见结果。"
    result: passed
    reason:
