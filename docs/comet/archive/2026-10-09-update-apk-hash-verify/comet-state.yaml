    text: |-
      实现「调起系统安装器前校验 APK SHA-256 与 GitHub 发行版一致」。改动三个源码文件 + 两个测试文件：
      1. update_service.dart：GitHubReleaseAsset 新增 digest 字段解析（缺失为空串）；新增 UpdateHashStatus（verified/mismatch/unavailable）、UpdateHashVerifyResult、顶层 parseApkDigest（同时解析 digest 字段 sha256:<hex> 与 sha256sum 输出首列，忽略 sha256: 前缀与十六进制大小写，非法返回 null）；UpdateInstaller 新增 resolveExpectedSha256（digest 优先，缺失/非法回退下载同名 .sha256，请求失败或解析不出 → null 即无法校验）、static computeFileSha256（crypto sha256.bind 流式读取）、verifyApk（三态校验）、deleteApk（文件不存在或删除失败不抛出）。下载逻辑与固定路径 app-jade.apk 未变，进度回调签名未变。
      2. profile_update_dialog.dart：交互改为两步——原「立即更新→下载完自动调起安装器」改为下载完成后停在完成态并显示「安装」按钮（A1/A9），点击安装才执行校验并显示「正在校验安装包完整性…」且防重复触发（A6/A14）；install 回调返回 ApkInstallOutcome(opened→关闭弹窗 / hashMismatch→提示「安装包校验失败，已阻止安装」+「重新下载」 / hashUnavailable→提示「无法校验安装包完整性，已阻止安装」+保留文件可重试 / openFailed→保留既有降级文案「安装包已下载，请在通知栏/文件管理器中安装」)；下载失败既有提示「下载失败，请重试」与重试入口保持（A8）。
      3. profile_settings_screen.dart：原 _downloadAndInstall 拆为 _downloadApk（下载并记录 _selectedUpdateAsset 以便安装时取 digest）与 _verifyAndInstallApk（verifyApk → mismatch 时 deleteApk 阻止安装返回 hashMismatch；unavailable 返回 hashUnavailable 保留文件；verified 经 OpenFilex.open 调起，返回 done→opened，否则 openFailed 覆盖既有降级语义 A15）。asset 缺失为防御性返回 hashUnavailable。
      4. 测试：update_service_test.dart 新增 parseApkDigest（4 例）、resolveExpectedSha256（4 例，含 digest 命中零请求、代理拼接、501 失败→null、非法 digest 回退）、computeFileSha256（边界值）、verifyApk（5 例：verified 大小写不敏感、.sha256 回退校验、期望不可用、文件缺失）、deleteApk（2 例）、digest 字段解析（2 例）；profile_update_dialog_test.dart 新增弹窗状态机 8 例（下载完成安装入口、进度展示、校验中防重复触发、通过关闭弹窗、不一致提示可重下、无法校验提示、调起失败文案、下载失败重试）。
