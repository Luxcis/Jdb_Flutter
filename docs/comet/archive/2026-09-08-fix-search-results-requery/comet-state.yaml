builder_handoff:
  candidate_id: 3c71614c-5f06-422f-9da8-d34caed1267d
  identity_provider: skill-coordinated
  builder_execution_ref: skill-coordinated:builder:ae42cd6a-ec03-49eb-b744-2f8fae663072
  iteration: 1
  summary:
    text: 将 /search/results 与 /search/magnet/results 两个结果路由的页面 widget 键由
      state.pageKey（仅含路径）改为 ValueKey(state.uri)（含 query）。根因：go_router 14.8.1 中
      context.replace 保留原页面键（parser.dart replace 分支），关键词结果页重搜时页面 State 被保留，各 Tab
      的 PaginationController（initState 捕获旧 query 闭包）不重新请求；磁链结果页因使用
      pushReplacement（每次唯一页面键）修复前已具备重搜能力，其键值改动为一致性防护。覆盖验收：A1（影片 Tab
      以新词重新请求并展示新结果，镜像路由测试断言 fake 数据源收到 query=新词）、A2（搜索框文本为新词）、A3（磁链页重搜断言 +
      真实路由测试以排序重置为判别信号）、A4（空白关键词不导航不重搜）、A5（进详情返回后页面状态保留，以未提交输入草稿为判别信号）、A6（重搜后返回到搜索首页，replace
      不加深栈）。另在 app_router_requirements_test 补充真实路由判别测试（影片 Tab 重置 +
      磁链排序重置）。开发期检查：flutter analyze 无问题；flutter test 全量 865 个通过；判别力验证通过（stash
      修复后真实路由影片/磁链测试均失败，恢复后通过）。已知限制：磁链页提交相同关键词会重建并重新请求（pushReplacement
      既有语义，未改变）；artifacts 的 D3/D4 已按实际机制修订。
    truncated: false
  addressed_acceptance_ids:
