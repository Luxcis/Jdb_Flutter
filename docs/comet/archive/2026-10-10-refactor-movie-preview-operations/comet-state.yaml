acceptance:
  - id: A1
    source: brief.md
    text: "**A1**. 存在一个通用
      `LeaseCoordinator`（或等效抽象），能够承载方向、wakelock、系统栏三种协调器的串行执行、lease
      所有权与迟到释放防护逻辑。"
    result: passed
    reason:
      text: MoviePreviewLeaseCoordinator 抽象存在于
        movie_preview_lease.dart，MoviePreviewOrientationCoordinator、MoviePreviewSystemUiCoordinator、MoviePreviewWakelockCoordinator
        均继承并复用其串行队列与 lease 所有权逻辑。
      truncated: false
  - id: A2
    source: brief.md
    text: "**A2**. `MoviePreviewOperationManager` 提供单一 `acquire()` / `release()`
      接口，内部同时管理横屏锁定、屏幕常亮、沉浸模式三种设备状态；Screen 不再分别持有三个 lease。"
    result: passed
    reason:
      text: MoviePreviewOperationManager 提供单一 acquire/release
        接口，内部同时管理方向、wakelock、系统栏；MoviePreviewScreen 仅持有
        MoviePreviewOperationLease。
      truncated: false
  - id: A3
    source: brief.md
    text: "**A3**. 重构后 `MoviePreviewScreen` 仍满足现有行为：进入页面时先锁横屏，成功后初始化和播放，播放期间保持
      wakelock，页面打开即进入沉浸模式，退出时恢复方向与系统栏。"
    result: passed
    reason:
      text: MoviePreviewScreen 仍先等待 orientationLocked 再初始化播放，播放成功后
        acquireWakelock，进入页面即设置系统栏沉浸；dispose 时统一 release。相关 widget 测试全部通过。
      truncated: false
  - id: A4
    source: brief.md
    text: "**A4**. 重叠页面场景下，旧页面的迟到 `release()` 不会覆盖新页面已经获取的设备状态。"
    result: passed
    reason:
      text: 通用 lease 协调器在 release 时校验 isOwned，旧 lease 被取代后其 release 不再触发恢复；wakelock
        多所有者模型保证重叠页面安全。相关测试通过。
      truncated: false
  - id: A5
    source: brief.md
    text: "**A5**. 方向锁定、系统栏设置或 wakelock 中任意一项失败时，不影响其他项的清理与恢复流程；页面仍可在退出后恢复系统默认状态。"
    result: passed
    reason:
      text: 方向锁定、系统栏或 wakelock 失败时，Screen 与 OperationManager 均忽略单个子操作错误并继续清理；dispose 时
        Future.wait 独立释放三项 lease。
      truncated: false
  - id: A6
    source: brief.md
    text: "**A6**. 现有 `test/features/movie_detail/movie_preview_*` 测试全部通过，并新增对通用
      lease 协调器与 OperationManager 的单元测试。"
    result: passed
    reason:
      text: 现有 movie_preview_* 测试通过；新增 movie_preview_lease_test.dart 与
        movie_preview_operation_manager_test.dart，覆盖通用 lease 与 OperationManager
        核心场景。
      truncated: false
  - id: A7
    source: brief.md
    text: "**A7**. `dart analyze` 无错误，`dart format` 无需额外修改。"
    result: passed
    reason:
      text: flutter analyze 6 个修改文件无错误；dart format 仅对 touched 文件执行，无需额外修改。
      truncated: false
