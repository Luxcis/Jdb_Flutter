        fields 为 {'name':'collect'}；页面逻辑 actor_detail_screen.dart:55-62 请求成功后才翻转
        has_collected 并弹'已收藏' SnackBar，与'服务器为准不乐观更新'的规格一致。
      truncated: false
  - id: A2
    source: brief.md
    text: 'A2: 在演员详情页，对一个已收藏的演员点击 AppBar 心形按钮，请求成功后心形立即变回空心，并出现"已取消收藏"提示。'
    result: passed
