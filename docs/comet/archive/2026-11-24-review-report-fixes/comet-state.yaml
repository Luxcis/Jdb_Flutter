A3: 服务端下发域名在应用为 baseUrl 前校验：非 `https` scheme、空 host 的条目被丢弃；全部不合规时保持当前域名不变；合规条目正常生效且不把不合规列表持久化为可用线路。"},{"id":"A4","reason":{"text":"auth_provider.dart:43-56,104-145,149-196 secure 与 legacy prefs 解码全程 try/catch，坏值删除并按未登录继续；main.dart:51-82 _bootstrap 按网络/超时分类 retryable 并传 StartupFailureScreen；startup_failure_screen.dart:32-36 两套中文文案且原始异常不进页面。独立运行 auth_provider_corruption_test 9 用例（含删除失败不阻断）与 startup_failure_screen_test 2 用例通过。","truncated":false},"result":"passed","source":"brief.md","text":"A4: 本地会话/用户数据损坏不影响启动：secure storage 或旧 prefs 中的 `key_auth_session`/`key_user` 为畸形 JSON 或非对象时，不抛异常、删除坏键、按未登录继续启动并进入登录引导；新增畸形数据回归测试；`_bootstrap` 区分可重试与不可重试错误。"},{"id":"A5","reason":{"text":"startup.dart:47-98 _stringListOrEmpty/_stringOrNull/_mapOrNull 容错，startup.g.dart 调用。独立运行 startup_test 字段漂移组（混合类型跳过、非列表降空、settings/user 不符降 null 且 returnsNormally、异常字段不影响其他字段）通过。","truncated":false},"result":"passed","source":"brief.md","text":"A5: 启动响应字段类型漂移不阻断启动：`recent_keywords`/`recent_magnet_keywords` 中的非字符串项被跳过，`settings`/`user` 类型异常降级为空/null，启动仍成功且其余字段可用。"},{"id":"A6","reason":{"text":"auth_provider.dart:242-252 logout 先清内存并 notify 再 best-effort tombstone；profile_screen.dart:126-155 退出有 try/catch、成功后才清密码与关注缓存、最后 go('/home')；app_router.dart:73-76 _allowAuthErrorLoginOnce 防过期重定向被 isLogged 弹回。独立运行 auth_provider_test 写失败仍登出、profile_screen_test 写失败仍回首页并清关注、session_refresh_service_test expired 用例通过。","truncated":false},"result":"passed","source":"brief.md","text":"A6: 退出登录在安全存储写失败时仍能登出：内存 token/user 先清空并通知，持久化失败被捕获记录；个人页退出有异常保护并进入未登录态/首页；会话过期分支的重定向不再被 `isLogged` 拦截。"},{"id":"A7","reason":{"text":"app_router.dart:32-41 refreshListenable=AuthProvider.authRevision；:68-99 redirect 按 matchedLocation 拦截未登录 /profile/ 子页并带 from；:52-66 goLoginForAuthError 用 go 替换栈。独立运行 app_router_auth_test 12 用例（未登录重定向、登录后重求值、登出后替换为 login、canPop==false、登录态下全局失效不被弹回）通过。","truncated":false},"result":"passed","source":"brief.md","text":"A7: 未登录访问 `/profile/**` 由路由重定向到登录页；会话失效被全局踢出时使用 go/replace 清理受保护页，返回键不能回到已登出的受保护页面；认证状态变化会