format --output=none --set-exit-if-changed lib test` 退出码 0；CI 构建流程包含该格式检查步骤；逻辑改动与纯格式改动在提交中可区分。"}],"children":null,"formalHash":"0cfb11f4c989044eb1cb6a270dc574fe3731687e6fa69c2ba1ab03c21dc90cbb","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"57c7b6a6947031e066ea1e135972944a4b61f9d2c5083645fdc27933a6a9f6b1","contractHash":"a5b3f3356cf7f224d2f5734d66435c12462f4ddd964eeaff21a8040135a6c162","inputHash":"66597c6fc9e2edfa2ead2dabb8966d3b45ef1509c9fdf6c8bb1735106ae5e6e8","legacyFingerprint":"79d0101c425e13e8309c1bf6f6a2f9af83bf45ff258685e891d93658118db0f0","source":"brief.md"},{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"6ad6b7acaf1fbf3b6acf0005445dfc5723fbed02f87f0a7d8078109607163fd9","contractHash":"e9c6ee5f5d4ab13270081579136720a3d5413789a335e1bc90cce1ef32902dd2","inputHash":"8ed32664a9d44dc927a83c2a7d4c51dce5220b42b89fc749e13e4d9bb5860ba9","legacyFingerprint":"fe94632686569918a02aeacfcc8bc29629b8962642609022b33a9eab9d1f3d41","source":"specs/review-findings-remediation/spec.md"}],"schema":"comet.native.shape-semantics.v1"},"shapeConfirmationHash":"a1cb12288e8209cf271e79b912f4376fc0c3b930acba6ca467821b48f34dc5dc","specChanges":[{"capability":"review-findings-remediation","operation":"create","source":"specs/review-findings-remediation/spec.md"}]},{"acceptanceReview":[{"evidence":["启动请求不再固定兜底域名：startup_provider.dart:72-111 每次 load 注入 DomainManager.candidateBaseUrls 并按持久化线路→apiDomains→备用域名→兜底顺序 while 轮询；startup_api_client.dart:63-78 resetCandidates/useNextDomain 切换 baseUrl；domain_manager.dart:58-91 生成去重候选。测试 test/core/network/startup_api_client_test.dart 覆盖候选遍历/608/耗尽后重试，test/core/network/domain_manager_test.dart 覆盖候选顺序；全量 +1123 通过。"],"id":"A1","note":"已实现并由 workflow 独立复核/测试覆盖","status":"implemented-with-evidence"},{"evidence":["domain_switch_interceptor.dart:11,36-46,64-69,106-109 重试标记存于 RequestOptions.extra 