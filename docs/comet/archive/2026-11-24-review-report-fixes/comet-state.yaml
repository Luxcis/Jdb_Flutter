nalyze","name":"静态分析","repeatable":true,"timeoutMs":1200000},{"argv":["test","--no-pub"],"cwdRef":".","executable":"flutter","id":"test","name":"全量测试","repeatable":true,"timeoutMs":1800000}]}},{"sequence":2,"value":{"choice":"approved","proposal":{"input":{"artifactRootRef":"docs","name":"review-report-fixes"},"outputs":{"shape.prepare":{"acceptance":[{"id":"A1","source":"brief.md","text":"A1: 启动请求不再固定单一兜底域名：冷启动时按持久化可用线路（key_baseurl/apiDomains）、备用域名、兜底域名的顺序尝试；主域不可达而本地存在可用线路时能成功进入主页；全部候选失败时仍显示启动失败页，且重试会重新遍历候选而非重复同一 URL。"},{"id":"A2","source":"brief.md","text":"A2: 线路轮转按请求生效：同一进程内首次 608/连接错误触发一次轮转，之后新的失败请求仍可再次轮转；并发失败请求只触发一次 `rotate()`（域名列表为 2 时不会双跳回原失效域名）；测试覆盖连续两次轮转。"},{"id":"A3","source":"brief.md","text":"A3: 服务端下发域名在应用为 baseUrl 前校验：非 `https` scheme、空 host 的条目被丢弃；全部不合规时保持当前域名不变；合规条目正常生效且不把不合规列表持久化为可用线路。"},{"id":"A4","source":"brief.md","text":"A4: 本地会话/用户数据损坏不影响启动：secure storage 或旧 prefs 中的 `key_auth_session`/`key_user` 为畸形 JSON 或非对象时，不抛异常、删除坏键、按未登录继续启动并进入登录引导；新增畸形数据回归测试；`_bootstrap` 区分可重试与不可重试错误。"},{"id":"A5","source":"brief.md","text":"A5: 启动响应字段类型漂移不阻断启动：`recent_keywords`/`recent_magnet_keywords` 中的非字符串项被跳过，`settings`/`user` 类型异常降级为空/null，启动仍成功且其余字段可用。"},{"id":"A6","source":"brief.md","text":"A6: 退出登录在安全存储写失败时仍能登出：内存 token/user 先清空并通知，持久化失败被捕获记录；个人页退出有异常保护并进入未登录态/首页；会话过期分支的重定向不再被 `isLogged` 拦截。"},{"id":"A7","source":"brief.md","text":"A7: 未登录访问 `/profile/**` 由路由重定向到登录页；会话失效被全局踢出时使用 go/replace 清理受保护页，返回键不能回到已登出的受保护页面；认证状态变化会重新求值路由。"},{"id":"A8","source":"brief.md","text":"A8: “我看过的”不再指向恒空占位页：使用真实 `status=watched` 数据源，有看过记录时展示影片列表；顶部 Tab 与筛选入口不再共用空 controller/空回调。"},{"id":"A9","source":"brief.md","text":"A9: 预告片进度条 seek 以进度条自身宽度为分母：点击/拖动到进度条某位置 seek 到对应比例时长，点击最右端接近视频结尾；尾部填充跟手；新增断言 seek 目标位置的测试。"},{"id":"A10","source":"brief.md","text":"A10: 播放操作层在缓冲/暂停恢复后重新开始自动隐藏计时；初始即处于缓冲的场景在恢复播放后也能自动隐藏；手动唤起后同样按规则隐藏。"},{"id":"A11","source":"brief.md","text":"A11: 剧照缩略图按槽位高度×DPR 限制解码尺寸（memCacheHeight 等），宽高比测量复用同一有界 provider 或使用已记忆比例；全屏图库仍按原图展示。"},{"id":"A12","source":"brief.md","text":"A12: 榜单响应缺少 `total_pages` 时按“本页满页则 totalPages=page+1，否则 page”推断，有码/无码/欧美/FC2 榜单可加载第 2 页；服务端 `current_page` 前移时当前页判断仍正确。"},{"id":"A13","source":"brief.md","text":"A13: Top250 使用服务端返回的 `ranking` 渲染名次（`ignore_watched` 过滤后名次可跳号且不再被改写为连续编号）；末页判断按 start_rank 上限或 total 收敛，短页不提前截断。"},{"id":"A14","source":"brief.md","text":"A14: 加载更多失败后，`PaginatedListView`、`MovieGridView`、`ActorGridView` 的滚动监听在 `error != null` 或 `hasMore == false` 时不再自动重发请求；仅用户点击“重试”按钮才重新请求。"},{"id":"A15","source":"brief.md","text":"A15: core 提供统一的 `userFacingErrorMessage(Object error)`：ApiException 显示服务端中文 message，连接/超时显示“网络连接失败，请检查网络”，其余显示“加载失败，请重试”；所有 ErrorRetryWidget 调用点与首页分区错误不再展示 DioException 原始英文串。"},{"id":"A16","source":"brief.md","text":"A16: 演员详情加载失败时展示中文错误文案与重试按钮，点击后重新加载；重试开始时错误态被重置，成功后正常展示内容。"},{"id":"A17","source":"brief.md","text":"A17: 登录/注册失败时展示服务端中文 message 而非 DioException 技术串（不再出现 “DioException [bad response]” 前缀）；响应缺少 token/user 时给出明确中文提示且不抛 TypeError；新增断言错误文案的测试。"},{"id":"A18","source":"brief.md","text":"A18: 注册页与登录页表单可滚动：键盘弹起或系统大字号时内容可滚动到提交按钮，不再出现 RenderFlex overflow，错误提示可见。"},{"id":"A19","source":"brief.md","text":"A19: 演员卡选中态使用 `colorScheme.onPrimary` 等语义色，暗色主题下勾选图形对比度达到非文本 3:1；Semantics 暴露选中状态。"},{"id":"A20","source":"brief.md","text":"A20: 名次徽章前景/底色对比度达到 4.5:1（或采用等效深色前景方案），读屏朗读包含“第 N 名”。"},{"id":"A21","source":"brief.md","text":"A21: 首页推荐轮播在系统开启“减少动态效果”时不自动切换；提供用户可操作的暂停/播放控制；现有触摸暂停与滚动行为不回退。"},{"id":"A22","source":"brief.md","text":"A22: 通过认证 Token 弹窗换号后，关注标签缓存被清空或按新账号同步；冷启动不再把上一账号的标签作为 batch_push 推给新账号。"},{"id":"A23","source":"brief.md","text":"A23: feature 之间不再存在横向 import（categories/profile 不再 import following）：关注按钮位于 core；仅做透传的 ProfileFollowingScreen 删除且路由直连 FollowingScreen；lib/features/settings/ 死代码删除；STRUCTURE.md/RULES.md 相关描述与实际一致。"},{"id":"A24","source":"brief.md","text":"A24: 片商/导演/系列复用同一个 core 泛型“Tab + 分页列表”屏；TabController 长度取自 children 长度；三个页面的加载/空态/错误/分页行为与改动前一致。"},{"id":"A25","source":"brief.md","text":"A25: 测试补齐且有效：注册页覆盖两次密码不一致、密码过短、接口报错、成功跳转（含 from）四个分支；注册 API 测试直接调