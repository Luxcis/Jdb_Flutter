  summary:
    text: 修复 TofuScroll 主题失聪：根因为组件仅在懒加载 itemBuilder 闭包内调用 Theme.of(context)，自身
      build() 不建立主题 Inherited 依赖，元素 deactivate→reactivate 后依赖注册被清空且不再恢复。修复：在
      build() 顶部解析 Theme.of(context)（colorScheme/textTheme.bodySmall）并传入
      itemBuilder 闭包，模式与同页 HomeSearchBar 一致；视觉与交互语义经逐行 diff
      核对与旧实现等价，仅新增主题响应性。新增真实链路回归测试
      test/features/home/tofu_theme_test.dart（mainForTest 启动→首页→切换
      themeMode/系统亮度，断言豆腐块 Card.color 实时跟随），修复前该链路可稳定复现失聪、修复后通过；覆盖
      A1/A6、A2/A7、A3/A8。A4/A9 由既有 tofu_scroll_test 路由断言与复核逐行 diff 保证，A5 由 home
      全套件与 analyze 保证。开发期检查：flutter test test/features/home/ --no-pub 50
      用例全过；flutter analyze --no-pub 无问题。已知限制：回归测试合并在单次 mainForTest
      内以规避多次启动的测试时钟污染（文件注释已说明）；测试宿主无 dynamic color、平台默认亮色，预期色基于
      AppTheme.light()/dark()。
    truncated: false
