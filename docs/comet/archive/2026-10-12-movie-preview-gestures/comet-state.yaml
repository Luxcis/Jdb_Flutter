acceptance:
  - id: A1
    source: brief.md
    text: "**A1**.
      播放页面中，顶部标题栏与底部操作栏始终同步显示、同步隐藏：单击播放画面可在“两者同时显示”与“两者同时隐藏”之间切换，不存在只显示其一的状态。"
    result: passed
    reason:
      text: MoviePreviewControlsOverlay 使用同一个 _visible ValueNotifier
        驱动顶部标题栏与底部操作栏，测试中验证了单击可同步切换显隐。
      truncated: false
  - id: A2
    source: brief.md
    text: "**A2**. 操作层显示后，在持续播放且无交互约 3 秒后自动同时隐藏；暂停、缓冲、播放完成或出错时操作层保持显示，不自动隐藏。"
    result: passed
    reason:
      text: 实现中 _resetHideTimer 在 isPlaying && !isBuffering && !isCompleted && 无错误 时启动
        3 秒自动隐藏；暂停、缓冲、完成、出错时 _canAutoHide 为 false，保持显示。
      truncated: false
  - id: A3
    source: brief.md
    text: "**A3**. 播放中长按画面任意位置，播放速度变为 2 倍并显示倍速指示；松开手指后立即恢复 1 倍原速，倍速指示消失。"
    result: passed
    reason:
      text: 长按手势 onLongPressStart 设置 setRate(2.0) 并显示倍速指示；onLongPressEnd 恢复
        setRate(1.0) 并隐藏指示，测试覆盖。
      truncated: false
  - id: A4
    source: brief.md
    text: "**A4**. 在屏幕左半区上下滑动时，屏幕亮度随之增大/减小，并实时显示当前亮度（图标 + 百分比）；手指离开后继续滑动可连续调节。"
    result: passed
    reason:
      text: 左半区垂直滑动通过 brightnessController.setBrightness 调节亮度，数值 clamp 到
        [0,1]，并实时显示图标与百分比指示器；退出页面时 _resetBrightness 恢复系统亮度。
      truncated: false
  - id: A5
    source: brief.md
    text: "**A5**. 在屏幕右半区上下滑动时，系统媒体音量随之增大/减小，并实时显示当前音量（图标 + 百分比）；手指离开后继续滑动可连续调节。"
    result: passed
    reason:
      text: 右半区垂直滑动通过 volumeController.setVolume 调节系统媒体音量，数值 clamp 到
        [0,1]，并实时显示图标与百分比指示器。
      truncated: false
  - id: A6
    source: brief.md
    text: "**A6**. 在播放画面上左右滑动时，按拖动距离快进/快退，滑动过程中实时显示目标位置（或偏移量）；松开后播放停留在目标位置。"
    result: passed
    reason:
      text: 水平滑动按满宽映射 90 秒 seek 窗口计算目标位置，clamp 在 [0, duration]，滑动中实时显示目标位置与偏移量，松开后
        seekTo(target)。
      truncated: false
  - id: A7
    source: brief.md
    text: "**A7**. 双击播放画面仍在“播放 ↔ 暂停”之间切换（与现有行为一致），且不再触发 media_kit 内置的双击快退/快进。"
    result: passed
    reason:
      text: 双击调用 _togglePlayPause 在播放/暂停间切换；buildView 使用 NoVideoControls，不再触发
        media_kit 内置双击快进/快退。
      truncated: false
  - id: A8
    source: brief.md
    text: "**A8**. 加载中与播放失败页面保持现有行为：顶部标题栏可见可返回，不显示底部操作栏与手势指示器。"
    result: passed
    reason:
      text: 加载/错误状态由 _buildStatusBody 渲染，只显示顶部 MoviePreviewHeader 与加载/错误内容，不叠加
        MoviePreviewControlsOverlay，底部栏与手势指示器均不显示。
      truncated: false
  - id: A9
    source: brief.md
    text: "**A9**. 全部 `test/features/movie_detail/movie_preview_*`
      测试与新增操作层测试通过；`dart analyze` 无错误。"
    result: passed
    reason:
      text: flutter test test/features/movie_detail/ 通过（144 tests passed）；针对变更文件的
        flutter analyze 无错误（No issues found!）。
      truncated: false
